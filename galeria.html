<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galería · Club de Golf de Tecnatom</title>
  <link rel="icon" href="escudo.jpg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=DM+Sans:wght@400;500;700&display=swap"/>
  <link rel="stylesheet" href="estilos.css"/>
</head>
<body class="pag-galeria">

<!-- ===== Cabecera común (igual en todas las páginas) ===== -->
<header class="cabecera">
  <div class="contenedor">
    <a class="marca" href="index.html">
      <img src="escudo.jpg" alt="Escudo del Club de Golf de Tecnatom" width="52" height="52"/>
      <span>
        <span class="marca-nombre">Club de Golf de Tecnatom</span>
        <span class="marca-lema">Desde 1993 · Madrid</span>
      </span>
    </a>
    <nav class="menu" aria-label="Secciones">
      <a href="index.html">Inicio</a>
      <a href="historia.html">Historia</a>
      <a href="temporadas.html">Temporadas</a>
      <a class="activo" href="galeria.html" aria-current="page">Galería</a>
    </nav>
    <!-- El año y el enlace de este botón se cambian en temporada.js -->
    <a class="boton-temporada" href="https://clubdegolfdetecnatom.github.io/campeonato2026/"><span class="solo-ancho">Temporada </span><span class="anio-temporada">2026</span></a>
  </div>
</header>

<div id="content">
  <h1 class="tit">Galería del club</h1>
  <div class="sub">Las fotos de cada jornada y evento, de la más reciente a la más antigua.</div>

  <div id="filtros"></div>
  <div id="lista"></div>
</div>

<div id="lb">
  <button id="lb-cerrar" aria-label="Cerrar">&times;</button>
  <button class="lb-nav" id="lb-prev" aria-label="Anterior">&#8249;</button>
  <img id="lb-img" src="" alt=""/>
  <button class="lb-nav" id="lb-next" aria-label="Siguiente">&#8250;</button>
  <div id="lb-cap"></div>
</div>

<!-- ===== Pie común ===== -->
<footer class="pie">
  <div class="contenedor">
    <div class="pie-nombre">Club de Golf de Tecnatom</div>
    <div>Web mantenida por la Oficina del CaddIA Master</div>
  </div>
</footer>

<script>
// ===== Las fotos viven en Supabase =====
// No hay que editar este fichero para añadir fotos: la galería lee las tablas
// "eventos_fotos" (un evento por fila) y "fotos" (una foto por fila) y se pinta sola.
// Las fotos nuevas se suben desde el portal del campeonato, pestaña Administración.
const SB_REST   = 'https://peztstoiswhmlmpyhefl.supabase.co/rest/v1';
const SB_PUBLIC = 'https://peztstoiswhmlmpyhefl.supabase.co/storage/v1/object/public';
const SB_KEY    = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlenRzdG9pc3dobWxtcHloZWZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1Mzk5MTMsImV4cCI6MjA5NzExNTkxM30.D-e9iyp8tXU_mQ8Jd7fx3qL36cyW6hOdJF7hSIAnxqU';

let EVENTOS = [];   // [{id, anio, actual, nombre, meta, fotos:[{url, mini, pie}]}], el más reciente primero
let anios = [];
let filtro = 'todas';

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function urlFoto(bucket, ruta){
  return SB_PUBLIC + '/' + encodeURIComponent(bucket) + '/' + ruta.split('/').map(encodeURIComponent).join('/');
}
async function leer(tabla, params){
  const r = await fetch(SB_REST + '/' + tabla + '?' + params, { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } });
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

const cF = document.getElementById('filtros');
const cL = document.getElementById('lista');

async function cargar(){
  cL.innerHTML = '<div class="vacio">Cargando fotos…</div>';
  try {
    const [evs, fs] = await Promise.all([
      leer('eventos_fotos', 'select=id,anio,nombre,meta,fecha&order=anio.desc,fecha.desc.nullslast'),
      leer('fotos', 'select=evento_id,bucket,ruta,ruta_mini,pie,orden&order=orden.asc,id.asc')
    ]);
    const esteAnio = new Date().getFullYear();
    EVENTOS = evs.map(e => ({
      id: e.id, anio: e.anio, actual: e.anio === esteAnio, nombre: e.nombre, meta: e.meta || '',
      fotos: fs.filter(f => f.evento_id === e.id).map(f => ({
        url: urlFoto(f.bucket, f.ruta),
        mini: urlFoto(f.bucket, f.ruta_mini || f.ruta),
        pie: f.pie || ''
      }))
    })).filter(e => e.fotos.length > 0);
    anios = [...new Set(EVENTOS.map(e => e.anio))].sort((a,b)=>b-a);
    pintaFiltros();
    pintaLista();
  } catch(err) {
    cF.innerHTML = '';
    cL.innerHTML = '<div class="vacio">No se han podido cargar las fotos. <a href="#" id="reintentar">Reintentar</a></div>';
    document.getElementById('reintentar').onclick = (ev) => { ev.preventDefault(); cargar(); };
  }
}

// ===== Render =====
function pintaFiltros(){
  let h = '<button class="filtro'+(filtro==='todas'?' on':'')+'" data-a="todas">Todas</button>';
  anios.forEach(a => { h += '<button class="filtro'+(filtro==a?' on':'')+'" data-a="'+a+'">'+a+'</button>'; });
  cF.innerHTML = h;
  cF.querySelectorAll('.filtro').forEach(b => b.onclick = () => { filtro = b.dataset.a; pintaFiltros(); pintaLista(); });
}

let planas = []; // lista plana de {url, cap} para el lightbox
function pintaLista(){
  const evs = EVENTOS.filter(e => filtro==='todas' || e.anio==filtro);
  planas = [];
  if(!evs.length){ cL.innerHTML = '<div class="vacio">Aún no hay fotos de esta temporada.</div>'; return; }
  let h = '';
  evs.forEach(e => {
    h += '<div class="evento"><div class="ev-cab"><div class="ev-info">'
      + '<div class="ev-nom">'+esc(e.nombre)+'</div><div class="ev-meta">'+esc(e.meta)+'</div></div>'
      + '<div class="ev-badge'+(e.actual?'':' arch')+'">'+e.anio+'</div></div>'
      + '<div class="ev-fotos">';
    e.fotos.forEach(f => {
      const idx = planas.length;
      planas.push({url: f.url, cap: e.nombre + (f.pie ? ' · ' + f.pie : '')});
      h += '<img loading="lazy" src="'+esc(f.mini)+'" alt="'+esc(f.pie || e.nombre)+'" data-i="'+idx+'"/>';
    });
    h += '</div></div>';
  });
  cL.innerHTML = h;
  cL.querySelectorAll('.ev-fotos img').forEach(img => img.onclick = () => abrir(+img.dataset.i));
}

// ===== Lightbox =====
const lb = document.getElementById('lb'), lbImg = document.getElementById('lb-img'), lbCap = document.getElementById('lb-cap');
let cur = 0;
function abrir(i){ cur = i; lbImg.src = planas[i].url; lbCap.textContent = planas[i].cap; lb.classList.add('on'); }
function cerrar(){ lb.classList.remove('on'); lbImg.src=''; }
function mover(d){ cur = (cur + d + planas.length) % planas.length; lbImg.src = planas[cur].url; lbCap.textContent = planas[cur].cap; }
document.getElementById('lb-cerrar').onclick = cerrar;
document.getElementById('lb-prev').onclick = () => mover(-1);
document.getElementById('lb-next').onclick = () => mover(1);
lb.onclick = (e) => { if(e.target === lb) cerrar(); };
document.addEventListener('keydown', e => {
  if(!lb.classList.contains('on')) return;
  if(e.key==='Escape') cerrar(); if(e.key==='ArrowLeft') mover(-1); if(e.key==='ArrowRight') mover(1);
});

cargar();
</script>
<script src="temporada.js"></script>
</body>
</html>
